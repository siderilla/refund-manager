<div class="list-container">
	<ag-grid-angular
		style="width: 100%; height: 600px;"
		class="ag-theme-material"
		[rowData]="outlays()"
		[columnDefs]="colDefs"
		[defaultColDef]="defaultColDef"
		[pagination]="true"
		[paginationPageSize]="15"
		(cellClicked)="onCellClicked($event)">
	</ag-grid-angular>
</div>
