<div class="water-widget-container">
    <div class="circle">
        <div class="label label-blue">{{ displayPercentage() }}%</div>

        <div class="water-fill" [style.height.%]="displayPercentage()">
            <div class="wave"></div>
        </div>

        <div class="label label-white" [style.clip-path]="'inset(' + (100 - displayPercentage()) + '% 0 0 0)'">
            {{ displayPercentage() }}%
        </div>
    </div>
</div>
