<div class="summary-grid">
	<div class="area-status">
		<app-widget-budgetstatus
		[employee]="employee()"></app-widget-budgetstatus>
	</div>
	<div class="area-calendar">
		<app-widget-calendar
		[employee]="employee()"
		(cellIsClicked)="selectedDate.set($event)"></app-widget-calendar>
	</div>
	<div class="area-charts">
		<app-widget-charts
		[date]="selectedDate()"
		[employee]="employee()"></app-widget-charts>
	</div>
	<div class="area-detail">
		<app-widget-outlaydetail
		[date]="selectedDate()"></app-widget-outlaydetail>
	</div>
</div>
