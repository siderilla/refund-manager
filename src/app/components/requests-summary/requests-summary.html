<div class="summary-grid">
	<div class="area-status">
		<app-widget-budgetstatus></app-widget-budgetstatus>
	</div>
	<div class="area-calendar">
		<app-widget-calendar
		[employee]="employee()"></app-widget-calendar>
	</div>
	<div class="area-charts">
		<app-widget-charts></app-widget-charts>
	</div>
	<div class="area-detail">
		<app-widget-outlaydetail></app-widget-outlaydetail>
	</div>
</div>
