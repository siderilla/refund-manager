<div class="form-container">
	<div class="form-header">
		<h2>NEW REFUND REQUEST</h2>
	</div>

	<form [formGroup]="outlayForm" (ngSubmit)="onSubmit()">
		<div class="form-group">
			<label for="category">Category</label>
			<select id="category" formControlName="categoryId">
				<option value="" disabled>Select a category</option>

				@for (cattegory of categories(); track cattegory.id) {
				<option [value]="cattegory.id">{{ cattegory.name }}</option>
				}
			</select>
		</div>

		<div class="row">
			<div class="form-group">
				<label for="date">Expense Date</label>
				<input id="date" type="date" formControlName="date">
			</div>

			<div class="form-group">
				<label for="amount">Amount (€)</label>
				<input id="amount" type="number" step="0.01" formControlName="amount" placeholder="0.00">
			</div>

			<div class="form-group">
				<label for="receipt">Receipt</label>
				<div class="receipt-radio">
					<label>
						<input id="receipt" type="radio" [value]="true" formControlName="receipt">
						<span>Yes</span>
					</label>
					<label>
						<input id="receipt" type="radio" [value]="false" formControlName="receipt">
						<!-- // was missing the value data binding  -->
						<span>No</span>
					</label>
				</div>

			</div>
		</div>

		<div class="form-group">
			<label for="description">Description</label>
			<textarea id="description" formControlName="description" rows="4"
				placeholder="Add details about the expense..."></textarea>
		</div>

		<div class="form-actions">
			<button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
			<button type="submit" class="btn-primary" [disabled]="outlayForm.invalid">Submit Request</button>
		</div>
	</form>
</div>
