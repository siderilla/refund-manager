<div class="form-container">
	<div class="form-header">
		<h2>NUOVA RICHIESTA DI RIMBORSO</h2>
	</div>

	<form [formGroup]="outlayForm" (ngSubmit)="onSubmit()">
		<div class="form-group">
			<label for="category">Categoria</label>
			<select id="category" formControlName="categoryId">
				<option value="" disabled>Seleziona una categoria</option>

				@for (cattegory of categories(); track cattegory.id) {
				<option [value]="cattegory.id">{{ cattegory.name }}</option>
				}
			</select>
		</div>

		<div class="row">
			<div class="form-group">
				<label for="date">Data Spesa</label>
				<input id="date" type="date" formControlName="date">
			</div>

			<div class="form-group">
				<label for="amount">Importo (€)</label>
				<input id="amount" type="number" step="0.01" formControlName="amount" placeholder="0.00">
			</div>

			<div class="form-group">
				<label for="receipt">Ricevuta</label>
				<div class="receipt-radio">
					<label>
						<input id="receipt" type="radio" [value]="true" formControlName="receipt">
						<span>Sì</span>
					</label>
					<label>
						<input id="receipt" type="radio" [value]="false" formControlName="receipt"> 
						<!-- // mancava il data binding del value  -->
						<span>No</span>
					</label>
				</div>

			</div>
		</div>

		<div class="form-group">
			<label for="description">Descrizione</label>
			<textarea id="description" formControlName="description" rows="4"
				placeholder="Aggiungi dettagli sulla spesa..."></textarea>
		</div>

		<div class="form-actions">
			<button type="button" class="btn-secondary" (click)="onCancel()">Annulla</button>
			<button type="submit" class="btn-primary" [disabled]="outlayForm.invalid">Invia Richiesta</button>
		</div>
	</form>
</div>
