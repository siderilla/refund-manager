<div class="calendar-container">

	<div class="cells-header">
		<button (click)="onChangeMonth(-1)">
			<i class="fa-solid fa-caret-left"></i>
		</button>

		<span>{{ monthName }}</span>

		<button (click)="onChangeMonth(1)">
			<i class="fa-solid fa-caret-right"></i>
		</button>
	</div>

	<div class="cells-container">

		@for (day of dayNames; track $index) {
		<div class="day-header">{{ day }}</div>
		}

		@for (cell of cells(); track cell.date) {

		<div class="cell" 
			(click)="onCellClick(cell)" 
			[class.cell-inactive]="!cell.isCurrentMonth"
			[style.background-color]="getCellColor(cell.outlayAmount, cell.isCurrentMonth)">

			@if (cell.isCurrentMonth && cell.outlayAmount != 0) {
				<div class="outlay-amount">
					{{ cell.outlayAmount }}€
				</div>
			}

			<div class="day-date">
				{{ cell.date.slice(-2) }}
			</div>

		</div>

		}

	</div>
</div>
