<div class="background">
	<div class="container">
		<form [formGroup]="loginForm">
			<div class="logo">
				<i class="fa-solid fa-people-roof" style="color: rgb(0, 102, 212);"></i>
			</div>
			<div class="title-login">
				<h2>LOG IN</h2>
			</div>
			<input id="name" type="text" formControlName="name" placeholder="Nome">
			<input id="surname" type="text" formControlName="surname" placeholder="Cognome">
			<button type="submit" (click)="onSubmitAuth()">Log In</button>
		</form>
	</div>
</div>
