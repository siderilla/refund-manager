<div class="sidebar-container">
	
	<div class="logo">
		<i class="fa-solid fa-people-roof" style="color: rgb(0, 102, 212);"></i>
	</div>

	<app-employee-menu 
		(viewSelected)="onViewSelected($event)"
		[currentActive]="activeView()?.type">
	</app-employee-menu>

	@if (isHR()) {

	<app-hr-menu 
		(viewSelected)="onViewSelected($event)"
		[currentActive]="activeView()?.type">
	</app-hr-menu>

	}

	<app-logout class="logout" [context]="'sidebar'"></app-logout>
</div>
