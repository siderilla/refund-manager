<div class="container-hr-menu" [class.collapsed]="collapsed()">
	<h4>HR Area</h4>
	<button (click)="onMenuHrClick('requests-pending')"
		[class.active]="currentActive() === 'requests-pending'">
		<i class="fa-solid fa-clock"></i>
		<p>Pending Requests</p>
	</button>

	<button (click)="onMenuHrClick('requests-archive')"
	[class.active]="currentActive() === 'requests-archive'">
		<i class="fa-solid fa-box-archive"></i>
		<p>Archive</p>
	</button>

	<button (click)="onMenuHrClick('requests-analytics')"
	[class.active]="currentActive() === 'requests-analytics'">
		<i class="fa-solid fa-chart-bar"></i>
		<p>Overview</p>
	</button>
</div>
